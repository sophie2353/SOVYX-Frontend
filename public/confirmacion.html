<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmación de Operación | SODIE</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Hoja de estilos principal del proyecto -->
  <link rel="stylesheet" href="/styles.css">

</head>
<body class="confirmation-body">

  <div class="confirmation-container">
    <div class="card confirmation-card" id="main-card">
      <div class="status-badge" id="conf-badge" data-i18n="badge_sodie_workflows">SODIE Workflows</div>
      <h2 class="conf-title" id="conf-title" data-i18n="conf_title_processing">Procesando...</h2>
      <p class="conf-body" id="conf-body" data-i18n="conf_body_loading">Cargando estado de la operación...</p>
      
      <div id="loader-box" class="loader-box"></div>
      <div id="steps-container"></div>
      
      <div class="action-grid">
        <button id="conf-action-btn" class="btn-action btn-secondary-glow" style="display: none;"></button>
        <button id="conf-verify-btn" class="btn-action btn-primary-glow" style="display: none;"></button>
      </div>
    </div>
  </div>

  <!-- Lógica modular externa -->
  <script src="/js/i18n.js"></script>
  <script src="/js/confirmacion.js"></script>

</body>
</html>

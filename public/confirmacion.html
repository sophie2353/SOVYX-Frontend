<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmación de Operación | SODIE</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Hoja de estilos principal del proyecto -->
  <link rel="stylesheet" href="/styles.css">

  <style>
    /* Estilos Premium UI para Confirmación */
    :root {
      --bg-dark: #090a0f;
      --card-bg: rgba(18, 20, 29, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --secondary: #10b981;
      --secondary-hover: #059669;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-glow: rgba(99, 102, 241, 0.25);
    }

    body.confirmation-body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 20% 20%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 80% 80%, rgba(16, 185, 129, 0.12) 0px, transparent 50%);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--text-main);
    }

    .confirmation-container {
      width: 100%;
      max-width: 580px;
    }

    .card.confirmation-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 40px 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), 0 0 30px var(--accent-glow);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      margin-bottom: 20px;
      background: rgba(99, 102, 241, 0.12);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    .conf-title {
      font-size: 1.85rem;
      font-weight: 800;
      margin: 0 0 12px 0;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }

    .conf-body {
      font-size: 1rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin: 0 0 28px 0;
    }

    /* Lista de Pasos UI */
    .steps-list {
      text-align: left;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 20px;
      margin: 20px 0 28px 0;
      list-style: none;
    }

    .steps-list li {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 16px;
      font-size: 0.95rem;
      color: #e5e7eb;
    }

    .steps-list li:last-child {
      margin-bottom: 0;
    }

    .step-number {
      background: var(--primary);
      color: #ffffff;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 2px;
    }

    /* Contenedor de Botones de Acción */
    .action-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 8px;
    }

    .btn-action {
      width: 100%;
      padding: 16px 24px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      box-sizing: border-box;
    }

    .btn-primary-glow {
      background: linear-gradient(135deg, var(--primary) 0%, #4338ca 100%);
      color: #ffffff;
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
    }

    .btn-primary-glow:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(99, 102, 241, 0.6);
      background: linear-gradient(135deg, #6366f1 0%, #3730a3 100%);
    }

    .btn-secondary-glow {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .btn-secondary-glow:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.25);
    }

    /* Spinner Animado */
    .loader-box {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s infinite linear;
      margin: 20px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <!-- Meta Pixel Code -->
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    
    fbq('init', '1754371812277932');
    fbq('track', 'PageView');
  </script>
  <noscript>
    <img height="1" width="1" style="display:none"
         src="https://www.facebook.com/tr?id=1754371812277932&ev=PageView&noscript=1"/>
  </noscript>
</head>
<body class="confirmation-body">

  <div class="confirmation-container">
    <div class="card confirmation-card" id="main-card">
      <div class="status-badge" id="conf-badge">SODIE Workflows</div>
      <h2 class="conf-title" id="conf-title">Procesando...</h2>
      <p class="conf-body" id="conf-body">Cargando estado de la operación...</p>
      
      <div id="loader-box" class="loader-box"></div>
      <div id="steps-container"></div>
      
      <div class="action-grid">
        <button id="conf-action-btn" class="btn-action btn-secondary-glow" style="display: none;"></button>
        <button id="conf-verify-btn" class="btn-action btn-primary-glow" style="display: none;"></button>
      </div>
    </div>
  </div>

  <!-- Lógica modular externa -->
  <script src="/js/confirmacion.js"></script>

</body>
</html>

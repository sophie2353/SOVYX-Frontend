<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmación de Pago | SODIE</title>

  <!-- Meta Pixel Code -->
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    
    fbq('init', '1754371812277932');
    fbq('track', 'PageView');
    
    // Disparo oficial del evento de Pago para atribución en Meta
    fbq('track', 'Purchase', {
      value: 1000.00,
      currency: 'USD',
      content_name: 'Reserva Slot SODIE'
    });
  </script>
  <noscript>
    <img height="1" width="1" style="display:none"
         src="https://www.facebook.com/tr?id=1754371812277932&ev=PageView&noscript=1"/>
  </noscript>
  <!-- End Meta Pixel Code -->

  <style>
    body {
      background-color: #050505;
      color: #00ffcc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: rgba(20, 20, 20, 0.8);
      border: 1px solid #00ffcc;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 0 25px rgba(0, 255, 204, 0.2);
      max-width: 400px;
      width: 100%;
    }
    h2 { margin-bottom: 10px; font-size: 1.5rem; }
    p { color: #ccc; font-size: 0.95rem; line-height: 1.4; }
    .loader {
      margin: 20px auto 0;
      border: 3px solid rgba(0, 255, 204, 0.1);
      border-top: 3px solid #00ffcc;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="card">
    <h2>¡Pago Confirmado!</h2>
    <p>Registrando evento en Meta Pixel y preparando tu panel de integración pospago...</p>
    <div class="loader"></div>
  </div>

  <script>
    // 1. Guardar la confirmación del pago en el navegador
    localStorage.setItem('sodie_payment_completed', 'true');

    // 2. Redirigir automáticamente de regreso al index.html en 2.5 segundos
    setTimeout(() => {
      window.location.href = 'index.html?status=paid_success';
    }, 2500);
  </script>

</body>
</html>

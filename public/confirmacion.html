<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmación | SODIE</title>

  <!-- Hoja de estilos principal del proyecto -->
  <link rel="stylesheet" href="/styles.css">

  <!-- Meta Pixel Code -->
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    
    fbq('init', '1754371812277932');
    fbq('track', 'PageView');
  </script>
  <noscript>
    <img height="1" width="1" style="display:none"
         src="https://www.facebook.com/tr?id=1754371812277932&ev=PageView&noscript=1"/>
  </noscript>
  <!-- End Meta Pixel Code -->
</head>
<body class="confirmation-body">

  <div class="card confirmation-card" id="main-card">
    <h2 id="conf-title">Procesando...</h2>
    <p id="conf-body">Cargando estado de la operación...</p>
    
    <div id="loader-box" class="loader"></div>
    
    <button id="conf-action-btn" class="btn" style="display: none;"></button>
    <button id="conf-verify-btn" class="btn btn-secondary" style="display: none;">Verificar Estado en Meta</button>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const step = urlParams.get('step');
      const campaignId = urlParams.get('campaignId');
      const actId = urlParams.get('actId');
      const sessionId = urlParams.get('sessionId');

      const titleEl = document.getElementById('conf-title');
      const bodyEl = document.getElementById('conf-body');
      const loaderEl = document.getElementById('loader-box');
      const actionBtn = document.getElementById('conf-action-btn');
      const verifyBtn = document.getElementById('conf-verify-btn');

      // =========================================================================
      // PASO 0: POST PAGO -> ACEPTAR EVALUADOR -> IR A CONTRATO / EXCEL
      // =========================================================================
      if (step === 'aceptar_rol') {
        loaderEl.style.display = 'none';
        titleEl.textContent = '🎉 ¡Pago Confirmado!';
        bodyEl.innerHTML = `
          Te hemos enviado la invitación como evaluador a tu cuenta de Meta.
          <ol style="text-align: left; margin: 20px 0; padding-left: 20px;">
            <li style="margin-bottom: 8px;">Haz clic abajo para <b>aceptar la solicitud en Facebook</b>.</li>
            <li>Luego presiona el botón para <b>continuar al Contrato y Carga de Excel</b>.</li>
          </ol>
        `;

        actionBtn.style.display = 'inline-block';
        actionBtn.className = 'btn btn-secondary';
        actionBtn.textContent = '1. Aceptar Solicitud en Facebook ↗';
        actionBtn.onclick = () => {
          window.open('https://developers.facebook.com/requests/', '_blank');
        };

        verifyBtn.style.display = 'inline-block';
        verifyBtn.className = 'btn btn-primary';
        verifyBtn.textContent = '2. Continuar a Contrato y Excel 📋';
        verifyBtn.onclick = () => {
          // Redirige a index.html para completar contrato y cargar Excel
          window.location.href = `/index.html?step=contrato_excel&sessionId=${sessionId || ''}`;
        };
      }

      // =========================================================================
      // PASO 1: CONECTAR META (Viene tras subir todo al 100% en index.html)
      // =========================================================================
      else if (step === 'conectar_meta') {
        loaderEl.style.display = 'none';
        titleEl.textContent = 'Archivos Recibidos al 100%';
        bodyEl.textContent = 'Tu contrato y segmentación en Excel están procesados. Ahora conecta tu cuenta de Facebook para inyectar la campaña.';

        verifyBtn.style.display = 'block';
        verifyBtn.className = 'btn btn-primary';
        verifyBtn.textContent = 'Conectar con Facebook';
        verifyBtn.onclick = async () => {
          verifyBtn.textContent = 'Iniciando sesión en Meta...';
          try {
            const res = await fetch('/api/facebook/connect', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ sessionId })
            });
            const data = await res.json();
            if (data.redirectUrl) {
              window.location.href = data.redirectUrl;
            } else {
              alert('Error al obtener URL de inicio de sesión de Meta.');
            }
          } catch (err) {
            alert('Error al conectar con la API de Facebook.');
          } finally {
            verifyBtn.textContent = 'Conectar con Facebook';
          }
        };
      }

      // =========================================================================
      // PASO 2: ACTIVAR CAMPAÑA Y REDIRIGIR A CLIENT.HTML (EN VERIFICACIÓN)
      // =========================================================================
      else if (step === 'activar_campana') {
        loaderEl.style.display = 'none';
        titleEl.textContent = 'Borrador Generado en Meta';
        bodyEl.textContent = 'Abre Meta Ads Manager para publicar creativos y presupuesto. Una vez publicado, pasará a revisión y tu Dashboard se activará.';
        
        actionBtn.style.display = 'inline-block';
        actionBtn.className = 'btn btn-secondary';
        actionBtn.textContent = '1. Abrir Meta Ads Manager ↗';
        actionBtn.onclick = () => {
          const webUrl = `https://adsmanager.facebook.com/adsmanager/manage/campaigns?act=${actId}&selected_campaign_ids=${campaignId}`;
          const appUrl = `fb://adsmanager/campaign?act=${actId}&campaign_id=${campaignId}`;

          if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
            const start = Date.now();
            window.location.href = appUrl;
            setTimeout(() => {
              if (Date.now() - start < 3000) window.location.href = webUrl;
            }, 2500);
          } else {
            window.open(webUrl, '_blank');
          }
        };

        verifyBtn.style.display = 'inline-block';
        verifyBtn.className = 'btn btn-primary';
        verifyBtn.textContent = '2. Ir a mi Dashboard (En Verificación) 📊';
        verifyBtn.onclick = async () => {
          verifyBtn.textContent = 'Registrando estado...';
          try {
            await fetch('/api/facebook/activar-campana', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ sessionId, campaignId })
            });
          } catch (err) {
            console.warn("Continuando hacia el dashboard...");
          }

          // Redirección directa a client.html
          window.location.href = `/client.html?sessionId=${sessionId || ''}&campaignId=${campaignId || ''}&status=verifying`;
        };
      }

      // =========================================================================
      // PASO 3: CONFIRMAR PAGO / CAPI
      // =========================================================================
      else if (step === 'confirmar_pago') {
        localStorage.setItem('sodie_payment_completed', 'true');

        if (typeof fbq === 'function') {
          fbq('track', 'Purchase', { value: 3000.00, currency: 'USD', content_name: 'Reserva Slot SODIE' });
        }

        titleEl.textContent = '¡Pago Confirmado!';
        bodyEl.textContent = 'Registrando evento CAPI/Pixel y preparando tu panel...';
        
        setTimeout(() => {
          window.location.href = `/client.html?sessionId=${sessionId || ''}&status=paid_success`;
        }, 2500);
      }

      // =========================================================================
      // FALLBACK POR DEFECTO
      // =========================================================================
      else {
        loaderEl.style.display = 'none';
        titleEl.textContent = 'Confirmación SODIE';
        bodyEl.textContent = 'Redirigiendo al panel principal...';
        actionBtn.style.display = 'block';
        actionBtn.textContent = 'Ir al Dashboard';
        actionBtn.onclick = () => window.location.href = `/client.html?sessionId=${sessionId || ''}`;
      }
    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmación | SODIE</title>

  <!-- Hoja de estilos principal del proyecto -->
  <link rel="stylesheet" href="/styles.css">

  <!-- Meta Pixel Code -->
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    
    fbq('init', '1754371812277932');
    fbq('track', 'PageView');
  </script>
  <noscript>
    <img height="1" width="1" style="display:none"
         src="https://www.facebook.com/tr?id=1754371812277932&ev=PageView&noscript=1"/>
  </noscript>
  <!-- End Meta Pixel Code -->
</head>
<body class="confirmation-body">

  <div class="card confirmation-card">
    <h2 id="conf-title">Procesando...</h2>
    <p id="conf-body">Cargando estado de la operación...</p>
    
    <div id="loader-box" class="loader"></div>
    
    <button id="conf-action-btn" class="btn" style="display: none;"></button>
    <button id="conf-verify-btn" class="btn btn-secondary" style="display: none;">Verificar Estado en Meta</button>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const step = urlParams.get('step');
      const campaignId = urlParams.get('campaignId');
      const actId = urlParams.get('actId');
      const sessionId = urlParams.get('sessionId');

      const titleEl = document.getElementById('conf-title');
      const bodyEl = document.getElementById('conf-body');
      const loaderEl = document.getElementById('loader-box');
      const actionBtn = document.getElementById('conf-action-btn');
      const verifyBtn = document.getElementById('conf-verify-btn');

      // CASO 1: POST AUTH (Viene del OAuth callback de Meta)
      if (step === 'procesar_excel') {
        loaderEl.style.display = 'none';
        titleEl.textContent = ' Conexión Exitosa con Meta';
        bodyEl.textContent = 'Tu cuenta ha sido vinculada correctamente. Procede a cargar la audiencia para generar el borrador.';
        actionBtn.style.display = 'block';
        actionBtn.textContent = 'Ir a Carga de Archivo';
        actionBtn.onclick = () => {
          window.location.href = `/index.html?step=procesar_excel&sessionId=${sessionId || ''}`;
        };
      }

      // CASO 2: POST CREAR BORRADOR (Borrador en PAUSED listo en Meta)
      else if (step === 'activar_campana') {
        loaderEl.style.display = 'none';
        titleEl.textContent = 'Borrador Generado en Meta';
        bodyEl.textContent = 'Abre Meta Ads Manager para publicar creativos y presupuesto, luego confirma la activación aquí.';
        
        actionBtn.style.display = 'block';
        actionBtn.textContent = 'Abrir Meta Ads Manager';
        actionBtn.onclick = () => {
          const webUrl = `https://adsmanager.facebook.com/adsmanager/manage/campaigns?act=${actId}&selected_campaign_ids=${campaignId}`;
          const appUrl = `fb://adsmanager/campaign?act=${actId}&campaign_id=${campaignId}`;

          if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
            const start = Date.now();
            window.location.href = appUrl;
            setTimeout(() => {
              if (Date.now() - start < 3000) window.location.href = webUrl;
            }, 2500);
          } else {
            window.open(webUrl, '_blank');
          }
        };

        verifyBtn.style.display = 'block';
        verifyBtn.onclick = async () => {
          verifyBtn.textContent = 'Verificando en Meta...';
          try {
            const res = await fetch(`/api/facebook/verificar-estado?campaignId=${campaignId}&actId=${actId}`);
            const data = await res.json();
            if (data.isActive) {
              window.location.href = `/index.html?view=dashboard&status=active&campaignId=${campaignId}`;
            } else {
              alert("Meta aún reporta la campaña como PAUSED. Publica los cambios en Ads Manager e intenta de nuevo.");
              verifyBtn.textContent = 'Verificar Estado en Meta';
            }
          } catch (err) {
            alert("Error al verificar estado con la API.");
            verifyBtn.textContent = 'Verificar Estado en Meta';
          }
        };
      }

      // CASO 3: POST PAGO / CAPI (Confirmación de Pago/Pixel)
      else if (step === 'confirmar_pago') {
        localStorage.setItem('sodie_payment_completed', 'true');

        // Disparar evento de Purchase en Pixel solo si viene de flujo de pago
        if (typeof fbq === 'function') {
          fbq('track', 'Purchase', { value: 1000.00, currency: 'USD', content_name: 'Reserva Slot SODIE' });
        }

        titleEl.textContent = ' ¡Pago Confirmado!';
        bodyEl.textContent = 'Registrando evento CAPI/Pixel y preparando tu panel...';
        
        setTimeout(() => {
          window.location.href = '/index.html?status=paid_success';
        }, 2500);
      }

      // FALLBACK POR DEFECTO
      else {
        loaderEl.style.display = 'none';
        titleEl.textContent = 'Confirmación SODIE';
        bodyEl.textContent = 'Redirigiendo al panel principal...';
        actionBtn.style.display = 'block';
        actionBtn.textContent = 'Ir al Inicio';
        actionBtn.onclick = () => window.location.href = '/index.html';
      }
    });
  </script>

</body>
</html>
